# Synced from golangci-config-shared. It is committed here rather than
# generated because that package is not published yet; once it is, replace
# this file with `make lint-sync` output and gitignore it.
# Generated by golangci-config-shared. Do not edit; edit the overlay instead.
formatters:
  enable:
    - gofumpt
    - gci
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/teo-garcia)
    gofumpt:
      extra-rules: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - .*\.gen\.go$
      - .*_generated\.go$
      - .*\.pb\.go$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
          - errcheck
          - gosec
          - noctx
          - unparam
        path: _test\.go
      - linters:
          - gosec
          - lll
        path: (migrations|seed)/
  settings:
    errcheck:
      check-blank: false
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - disabled: true
          name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
      severity: warning
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
output:
  formats:
    text:
      colors: true
      path: stdout
      print-linter-name: true
  sort-order:
    - file
    - linter
run:
  modules-download-mode: readonly
  tests: true
  timeout: 5m
version: "2"
